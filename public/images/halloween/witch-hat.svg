<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 115" fill="none">
  <defs>
    <!-- Hat Cone Gradient -->
    <linearGradient id="hatConeGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3b1d64" />
      <stop offset="40%" stop-color="#241142" />
      <stop offset="85%" stop-color="#150a27" />
      <stop offset="100%" stop-color="#0e061a" />
    </linearGradient>

    <!-- Hat Brim Gradient -->
    <radialGradient id="hatBrimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2b144d" />
      <stop offset="70%" stop-color="#190a2e" />
      <stop offset="100%" stop-color="#0d0418" />
    </radialGradient>

    <!-- Orange Ribbon Gradient -->
    <linearGradient id="hatRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa500" />
      <stop offset="50%" stop-color="#ff7700" />
      <stop offset="100%" stop-color="#d94f00" />
    </linearGradient>

    <!-- Pumpkin Glow -->
    <filter id="pumpkinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ff8800" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Hat Brim Drop Shadow -->
  <ellipse cx="70" cy="94" rx="66" ry="14" fill="#000000" opacity="0.35" filter="blur(3px)" />

  <!-- Hat Brim -->
  <ellipse cx="68" cy="92" rx="64" ry="13" fill="url(#hatBrimGrad)" stroke="#4a2580" stroke-width="1.2" />
  <ellipse cx="68" cy="90" rx="55" ry="9" fill="#1c0b33" opacity="0.6" />

  <!-- Cone Body (Floppy & Crinkled Witch Cone) -->
  <path d="M 32 89 
           C 40 76, 52 58, 58 40 
           C 62 28, 68 14, 82 8 
           C 92 4, 98 10, 95 18 
           C 92 24, 85 28, 80 34 
           C 78 44, 85 58, 92 70 
           C 98 80, 102 85, 106 89 Z" 
        fill="url(#hatConeGrad)" />

  <!-- Cone Highlights / Creases -->
  <path d="M 58 40 C 66 48, 74 62, 78 78" stroke="#5c2e99" stroke-width="1.8" stroke-linecap="round" opacity="0.55" fill="none" />
  <path d="M 68 14 C 74 22, 78 30, 80 34" stroke="#793dbd" stroke-width="2" stroke-linecap="round" opacity="0.65" fill="none" />

  <!-- Orange Ribbon / Belt -->
  <path d="M 33 88 
           C 54 94, 84 94, 105 88 
           L 103 80 
           C 82 86, 55 86, 35 80 Z" 
        fill="url(#hatRibbonGrad)" 
        stroke="#ffaa00" 
        stroke-width="0.8" />

  <!-- Carved Jack-o'-Lantern Pumpkin on the Ribbon -->
  <g filter="url(#pumpkinGlow)">
    <!-- Pumpkin Body -->
    <ellipse cx="68" cy="85" rx="14" ry="10.5" fill="#ff7a00" />
    <ellipse cx="63" cy="85" rx="10" ry="10" fill="#f97316" />
    <ellipse cx="73" cy="85" rx="10" ry="10" fill="#f97316" />
    <ellipse cx="68" cy="85" rx="7" ry="10.5" fill="#ffa000" />

    <!-- Stem -->
    <path d="M 67 76 C 67 73, 69 71, 71 70 C 70 72, 69 74, 69 76 Z" fill="#15803d" />

    <!-- Carved Glowing Eyes (Triangles) -->
    <polygon points="63,82 66,85 62,86" fill="#1a0b02" />
    <polygon points="73,82 74,86 70,85" fill="#1a0b02" />
    <polygon points="63.5,82.5 65.5,84.5 62.5,85.5" fill="#fff7ed" />
    <polygon points="72.5,82.5 73.5,85.5 70.5,84.5" fill="#fff7ed" />

    <!-- Carved Jagged Smile -->
    <path d="M 62 89 Q 68 93 74 89 Q 72 92 68 92 Q 64 92 62 89 Z" fill="#1a0b02" />
    <polygon points="65,89.5 66.5,91 67.5,89.5" fill="#fff7ed" />
    <polygon points="68.5,89.5 69.5,91 71,89.5" fill="#fff7ed" />
  </g>
</svg>
