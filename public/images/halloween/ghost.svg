<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="none">
  <defs>
    <linearGradient id="ghostBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="65%" stop-color="#f1f5f9" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.85" />
    </linearGradient>
    <filter id="ghostGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#60a5fa" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#a855f7" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#ghostGlow)">
    <!-- Ghost Body -->
    <path d="M 50 10 
             C 28 10, 18 28, 18 48 
             C 18 56, 12 60, 6 64 
             C 3 66, 4 72, 9 72 
             C 16 72, 24 64, 25 58 
             C 25 70, 20 86, 22 96 
             C 23 99, 27 101, 30 98 
             C 35 93, 40 93, 44 98 
             C 47 101, 53 101, 56 98 
             C 60 93, 65 93, 70 98 
             C 73 101, 77 99, 78 96 
             C 80 86, 75 70, 75 58 
             C 76 64, 84 72, 91 72 
             C 96 72, 97 66, 94 64 
             C 88 60, 82 56, 82 48 
             C 82 28, 72 10, 50 10 Z" 
          fill="url(#ghostBodyGrad)" />

    <!-- Cute Ghost Face -->
    <!-- Left Eye -->
    <ellipse cx="40" cy="44" rx="4.5" ry="6.5" fill="#1e1035" />
    <circle cx="41.5" cy="42" r="1.8" fill="#ffffff" />
    
    <!-- Right Eye -->
    <ellipse cx="60" cy="44" rx="4.5" ry="6.5" fill="#1e1035" />
    <circle cx="61.5" cy="42" r="1.8" fill="#ffffff" />

    <!-- Cute Spooky "O" Mouth -->
    <ellipse cx="50" cy="56" rx="3.5" ry="5" fill="#1e1035" />

    <!-- Rosy Cheeks -->
    <ellipse cx="33" cy="51" rx="4" ry="2.5" fill="#f472b6" opacity="0.45" />
    <ellipse cx="67" cy="51" rx="4" ry="2.5" fill="#f472b6" opacity="0.45" />
  </g>
</svg>
