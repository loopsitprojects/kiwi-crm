<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 45" fill="none">
  <defs>
    <linearGradient id="batOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="50%" stop-color="#ff7300" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="batGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ff6600" flood-opacity="0.6" />
    </filter>
  </defs>
  <g filter="url(#batGlow)">
    <!-- Bat Body & Wings (Flying with pointed curved wingtips) -->
    <path d="M 40 22 
             C 35 12, 24 6, 8 10 
             C 3 11, 1 15, 3 17 
             C 10 22, 17 22, 22 19 
             C 21 27, 27 30, 31 27 
             C 33 32, 38 32, 40 28 
             C 42 32, 47 32, 49 27 
             C 53 30, 59 27, 58 19 
             C 63 22, 70 22, 77 17 
             C 79 15, 77 11, 72 10 
             C 56 6, 45 12, 40 22 Z" 
          fill="url(#batOrangeGrad)" />
    <!-- Bat Ears -->
    <polygon points="38,20 37,15 39,18" fill="#ff7300" />
    <polygon points="42,20 43,15 41,18" fill="#ff7300" />
  </g>
</svg>
